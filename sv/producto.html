<!doctype html>
<html lang="es-SV">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Producto · Duka Bora El Salvador</title>
  <meta name="description" content="Envíos a todo El Salvador. Pagas en efectivo al recibir tu pedido." />
  <meta name="theme-color" content="#0f1d33" />
  <meta property="og:type" content="product" />
  <meta property="og:locale" content="es_SV" />
  <link rel="icon" href="../images/logo/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="css/sv.css" />
  <link rel="stylesheet" href="css/product.css" />
</head>
<body data-page="product">
  <header id="site-header"></header>

  <main id="main">
    <div class="container" style="padding-top:18px">
      <nav class="crumbs" aria-label="Ruta" id="crumbs"></nav>
    </div>

    <!-- 1. Hero: gallery + buy box -->
    <section class="pdp container">
      <div class="gallery" id="gallery"></div>
      <div class="buy" id="buy"></div>
    </section>

    <!-- 2. Benefits -->
    <section class="section section--beige" id="benefitsSec">
      <div class="container">
        <div class="section__head reveal"><div><span class="eyebrow">Beneficios</span><h2 class="title" id="benefitsTitle"></h2></div></div>
        <div class="why" id="benefits"></div>
      </div>
    </section>

    <!-- 3. Problem / solution -->
    <section class="section" id="psSec">
      <div class="container ps" id="ps"></div>
    </section>

    <!-- 4. Features -->
    <section class="section section--beige" id="featuresSec">
      <div class="container">
        <div class="section__head reveal"><div><span class="eyebrow">Características</span><h2 class="title">Pensado en <em>cada detalle</em></h2></div></div>
        <div class="features" id="features"></div>
      </div>
    </section>

    <!-- 5. Gallery -->
    <section class="section" id="gallerySec">
      <div class="container">
        <div class="section__head reveal"><div><span class="eyebrow">Galería</span><h2 class="title">Míralo <em>de cerca</em></h2></div></div>
        <div class="mosaic" id="mosaic"></div>
      </div>
    </section>

    <!-- 6. How it works -->
    <section class="section section--navy" id="howSec">
      <div class="container">
        <div class="section__head reveal"><div><span class="eyebrow">Cómo funciona</span><h2 class="title">Así de <em>fácil</em></h2></div></div>
        <div class="how" id="how"></div>
      </div>
    </section>

    <!-- 7. Specs -->
    <section class="section" id="specsSec">
      <div class="container specs-wrap">
        <div class="reveal" style="display:grid;gap:14px;align-content:start"><span class="eyebrow">Especificaciones</span><h2 class="title">Ficha <em>técnica</em></h2></div>
        <dl class="specs reveal" id="specs"></dl>
      </div>
    </section>

    <!-- 8. Reviews -->
    <section class="section section--beige" id="reviewsSec">
      <div class="container">
        <div class="section__head reveal"><div><span class="eyebrow">Opiniones</span><h2 class="title">Lo que dicen <em>nuestros clientes</em></h2></div></div>
        <div id="reviews"></div>
      </div>
    </section>

    <!-- 9. FAQ -->
    <section class="section" id="faqSec">
      <div class="container faq-wrap">
        <div class="reveal" style="display:grid;gap:14px;align-content:start"><span class="eyebrow">Preguntas frecuentes</span><h2 class="title">Resolvemos <em>tus dudas</em></h2></div>
        <div class="faq reveal" id="faq"></div>
      </div>
    </section>

    <!-- 10. CTA -->
    <section class="section" style="padding-top:0">
      <div class="container"><div class="cta-band reveal" id="cta"></div></div>
    </section>

    <!-- Related -->
    <section class="section section--beige" id="relatedSec">
      <div class="container">
        <div class="section__head reveal"><div><span class="eyebrow">También te puede gustar</span><h2 class="title">Productos <em>relacionados</em></h2></div></div>
        <div class="grid grid--4" id="related"></div>
      </div>
    </section>
  </main>

  <!-- Sticky add-to-cart on mobile -->
  <div class="sticky-buy" id="stickyBuy" aria-hidden="true"></div>

  <footer id="site-footer"></footer>

  <script src="config.js"></script>
  <script src="js/shop.js"></script>
  <script src="js/producto.js"></script>
</body>
</html>
