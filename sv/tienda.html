<!doctype html>
<html lang="es-SV">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Tienda · Duka Bora El Salvador</title>
  <meta name="description" content="Todos nuestros productos con envío a todo El Salvador y pago contra entrega." />
  <meta name="theme-color" content="#0f1d33" />
  <link rel="canonical" href="https://dukaabora.store/sv/tienda.html" />
  <meta property="og:locale" content="es_SV" />
  <meta property="og:title" content="Tienda · Duka Bora El Salvador" />
  <meta property="og:image" content="https://dukaabora.store/images/rw1.webp" />
  <link rel="icon" href="../images/logo/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="css/sv.css" />
</head>
<body data-page="shop">
  <header id="site-header"></header>

  <main>
    <section class="page-head">
      <div class="container">
        <nav class="crumbs" aria-label="Ruta"><a href="index.html">Inicio</a><span aria-hidden="true">/</span><span id="crumb">Tienda</span></nav>
        <h1 class="title" id="shopTitle">Toda la <em>tienda</em></h1>
        <p class="lead" id="shopLead" style="margin-top:10px">Envíos a todo El Salvador · Pagas al recibir</p>
      </div>
    </section>

    <section class="section" style="padding-top:36px">
      <div class="container">
        <div class="chips" id="chips" role="tablist" aria-label="Categorías"></div>
        <div class="toolbar">
          <span id="count"></span>
          <label><span class="sr-only">Ordenar por</span>
            <select id="sort">
              <option value="">Recomendados</option>
              <option value="asc">Precio: menor a mayor</option>
              <option value="desc">Precio: mayor a menor</option>
            </select>
          </label>
        </div>
        <div class="grid grid--4" id="grid"></div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="config.js"></script>
  <script src="js/shop.js"></script>
  <script>
    (() => {
      const { $, esc, products, card, category, initReveal } = Shop;
      const params = new URLSearchParams(location.search);
      let cat = params.get("cat") || "";
      if (cat && !category(cat)) cat = "";
      const cats = CONFIG.categories.filter((c) => products.some((p) => p.category === c.id));

      function render() {
        const c = category(cat);
        $("#chips").innerHTML = [{ id: "", name: "Todo" }, ...cats].map((x) =>
          `<button type="button" class="chip ${x.id === cat ? "is-on" : ""}" data-cat="${esc(x.id)}" role="tab" aria-selected="${x.id === cat}">${esc(x.name)}</button>`).join("");
        $("#shopTitle").innerHTML = c ? esc(c.name) : "Toda la <em>tienda</em>";
        $("#shopLead").textContent = c ? c.text : "Envíos a todo El Salvador · Pagas al recibir";
        $("#crumb").textContent = c ? c.name : "Tienda";
        document.title = (c ? c.name : "Tienda") + " · Duka Bora El Salvador";
        let list = products.filter((p) => !cat || p.category === cat);
        const s = $("#sort").value;
        if (s) list = list.slice().sort((a, b) => (s === "asc" ? a.price - b.price : b.price - a.price));
        $("#count").textContent = list.length + (list.length === 1 ? " producto" : " productos");
        $("#grid").innerHTML = list.map(card).join("") || '<p>No hay productos en esta categoría por ahora.</p>';
        initReveal();
      }
      $("#chips").addEventListener("click", (e) => {
        const b = e.target.closest("[data-cat]");
        if (!b) return;
        cat = b.dataset.cat;
        const url = new URL(location.href);
        if (cat) url.searchParams.set("cat", cat); else url.searchParams.delete("cat");
        history.replaceState(null, "", url);
        render();
      });
      $("#sort").addEventListener("change", render);
      render();
    })();
  </script>
</body>
</html>
