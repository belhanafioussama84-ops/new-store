<!doctype html>
<html lang="es-SV">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>¡Gracias por tu pedido! · Duka Bora El Salvador</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0f1d33" />
  <link rel="icon" href="../images/logo/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="css/sv.css" />
  <link rel="stylesheet" href="css/checkout.css" />
</head>
<body data-page="thanks">
  <header id="site-header"></header>
  <main class="ty"><div class="container"><div class="ty__card" id="ty"></div></div></main>
  <footer id="site-footer"></footer>

  <script src="config.js"></script>
  <script src="js/shop.js"></script>
  <script>
    (() => {
      const { $, esc, money, icon, storage, Pixel, waLink } = Shop;
      const n = new URLSearchParams(location.search).get("n") || "";
      const o = storage.get("sv_last_order", null);
      const box = $("#ty");
      // This page is shown only after the Google Sheet confirmed the order (see js/checkout.js).
      if (!o || o.number !== n) {
        box.innerHTML = `<h1>No encontramos tu pedido</h1>
          <p>Si ya hiciste un pedido, te llamaremos para confirmarlo. Si tienes dudas, escríbenos.</p>
          <a href="index.html" class="btn btn--dark">Volver a la tienda</a>`;
        return;
      }
      box.innerHTML = `
        <div class="ty__check">${icon("check")}</div>
        <h1>¡Gracias, ${esc(o.customer.fullName.split(" ")[0])}!</h1>
        <p class="lead">Recibimos tu pedido. Pronto te llamaremos al <strong>${esc(o.customer.phone)}</strong> para confirmarlo antes de enviarlo.</p>
        <span class="ty__num">Pedido ${esc(o.number)}</span>
        <div class="ty__next">
          <div>${icon("phone")}<span><strong>1. Te llamamos</strong>Mantén tu teléfono cerca: confirmamos el producto y la dirección.</span></div>
          <div>${icon("truck")}<span><strong>2. Enviamos tu pedido</strong>Entrega en ${esc(CONFIG.shipping.time)} a tu dirección.</span></div>
          <div>${icon("cash")}<span><strong>3. Pagas al recibir</strong>Ten listo el pago en efectivo: <strong style="display:inline">${money(o.total)}</strong>.</span></div>
        </div>
        <div class="ty__sum">
          <ul>${o.items.map((i) => `<li><span>${esc(i.name)}${i.option ? ` (${esc(i.option)})` : ""} × ${i.qty}</span><span>${money(i.unitPrice * i.qty)}</span></li>`).join("")}
            ${o.discount > 0 ? `<li><span>Descuento por paquete</span><span>−${money(o.discount)}</span></li>` : ""}
            <li><span>Envío</span><span>${o.shipping ? money(o.shipping) : "Gratis"}</span></li>
            <li><span><strong>Total a pagar al recibir</strong></span><span>${money(o.total)} ${CONFIG.currency}</span></li>
          </ul>
          <p class="ty__addr">${icon("pin")} ${esc(o.customer.city)}</p>
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:10px;justify-content:center">
          <a href="index.html" class="btn btn--dark">Seguir comprando</a>
          ${CONFIG.whatsapp ? `<a href="${waLink(`Hola, hice el pedido ${o.number}.`)}" class="btn btn--ghost" target="_blank" rel="noopener">Escribir por WhatsApp</a>` : ""}
        </div>`;
      // Purchase is sent once per order (eventID = order number, so a reload is not counted twice)
      const KEY = "sv_pixel_sent";
      const sent = storage.get(KEY, []);
      if (!sent.includes(o.number)) {
        Pixel.track("Purchase", {
          content_ids: o.items.map((i) => i.id), content_type: "product",
          contents: o.items.map((i) => ({ id: i.id, quantity: i.qty })),
          num_items: o.items.reduce((s, i) => s + i.qty, 0), value: o.total, currency: CONFIG.currency,
        }, { eventID: o.number });
        storage.set(KEY, [...sent, o.number].slice(-30));
      }
    })();
  </script>
</body>
</html>
